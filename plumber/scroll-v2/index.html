<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- BUSINESS NAME --></title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0a0a0f; color:#fff; overflow-x:hidden; }

.hero { position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; background:linear-gradient(135deg,#0a0a0f,#1a1a2e); }
.hero h1 { font-size:clamp(36px,5vw,60px); font-weight:800; margin-bottom:12px; background:linear-gradient(135deg,#fff 40%,#8899aa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.hero .tagline { font-size:clamp(16px,2vw,20px); color:#8899aa; margin-bottom:28px; max-width:540px; }
.hero .cta { display:inline-block; padding:14px 36px; background:linear-gradient(135deg,#c96a1b,#a85a10); color:#fff; text-decoration:none; border-radius:6px; font-size:16px; font-weight:600; }
.hero .cta:hover { background:#b85d12; }
.hero .phone { display:block; font-size:18px; color:rgba(255,255,255,0.5); margin-top:10px; letter-spacing:0.5px; }
.scroll-hint { position:absolute; bottom:36px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:2px; color:rgba(255,255,255,0.12); animation:bounce 2s infinite; }
@keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-6px)} }

#world { width:100%; }
.scene { width:100%; height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.scene img { width:100%; height:100%; object-fit:cover; }
.scene .overlay { position:absolute; inset:0; background:linear-gradient(0deg,rgba(0,0,0,0.6) 0%,transparent 50%); display:flex; flex-direction:column; justify-content:flex-end; padding:60px 36px; }
.scene .overlay .label { font-size:11px; text-transform:uppercase; letter-spacing:2px; color:#c96a1b; margin-bottom:6px; }
.scene .overlay h2 { font-size:clamp(24px,3.5vw,36px); margin-bottom:6px; }
.scene .overlay p { font-size:15px; color:#8899aa; max-width:480px; }

@media(max-width:768px){
  .scene .overlay { padding:32px 20px; }
  .scene .overlay h2 { font-size:22px; }
}
/* ============================================================
   Motion Layer — design upgrade for duda-clone template
   ============================================================
   Sources:
   - emilkowalski/skills (improve-animations): performance-first
     motion, transforms+opacity only, product-grade restraint
   - impeccable (pbakaus): craft floor, no distracting loops
   - motionsites.ai: 3D/scroll-driven hero energy (restrained)
   - 21st.dev: micro-interaction polish on hover/focus

   Principles:
   1. Only transform + opacity (GPU-composited, no layout thrash)
   2. One easing curve, one duration scale (see tokens)
   3. Motion on scroll-reveal, hover, focus — never infinite loops
   4. Respect prefers-reduced-motion at every level
   ============================================================ */

:root{
  /* Motion tokens (from Emil Kowalski's guidance) */
  --ease-out: cubic-bezier(.16,1,.3,1);       /* enter */
  --ease-in-out: cubic-bezier(.65,.05,.36,1); /* exit / state */
  --dur-fast: 150ms;
  --dur-base: 250ms;
  --dur-slow: 400ms;
  --reveal-offset: 24px;
  --hover-lift: -4px;
  --hover-scale: 1.02;
  --card-shadow-hover: 0 12px 32px rgba(13,50,80,.14);
}

/* ─── Scroll-reveal (IntersectionObserver-driven) ─────────── */
.reveal{
  opacity:0;
  transform:translateY(var(--reveal-offset));
  transition:opacity var(--dur-slow) var(--ease-out),
             transform var(--dur-slow) var(--ease-out);
  transition-delay:var(--reveal-delay,0ms);
  will-change:opacity,transform;
}
.reveal.reveal-left{transform:translateX(calc(var(--reveal-offset) * -1))}
.reveal.reveal-right{transform:translateX(var(--reveal-offset))}
.reveal.reveal-zoom{transform:scale(.96)}
.reveal.is-visible{opacity:1;transform:none}

/* ─── Hover / focus micro-interactions ─────────────────────── */
a[href],button,.card,.service-card,.gallery-item,.testimonial-card{
  transition:transform var(--dur-base) var(--ease-out),
             box-shadow var(--dur-base) var(--ease-out),
             border-color var(--dur-base) var(--ease-out),
             background-color var(--dur-base) var(--ease-out);
}
a[href]:hover,button:hover,.card:hover,.service-card:hover,.gallery-item:hover,.testimonial-card:hover{
  transform:translateY(var(--hover-lift));
  box-shadow:var(--card-shadow-hover);
}
a[href]:active,button:active{transform:translateY(-1px) scale(.99)}
a[href]:focus-visible,button:focus-visible{
  outline:2px solid var(--c4);outline-offset:2px;border-radius:4px;
}

/* CTA buttons get a subtle scale + shadow bloom */
.cta-button,.hero-cta,.btn-primary{
  transition:transform var(--dur-base) var(--ease-out),
             box-shadow var(--dur-base) var(--ease-out),
             filter var(--dur-base) var(--ease-out);
}
.cta-button:hover,.hero-cta:hover,.btn-primary:hover{
  transform:translateY(-2px) scale(var(--hover-scale));
  box-shadow:0 10px 28px rgba(0,0,0,.18);
  filter:brightness(1.06);
}

/* ─── Image reveals (subtle zoom on hover) ─────────────────── */
.gallery-item img,.service-card img,.hero-img,.feature-img{
  transition:transform var(--dur-slow) var(--ease-out);
}
.gallery-item:hover img,.service-card:hover img{transform:scale(1.04)}

/* ─── Hero entrance (load-time, staggered) ─────────────────── */
.hero .hero-title,.hero .hero-subtitle,.hero .hero-cta,.hero .hero-img{
  opacity:0;
  animation:hero-enter var(--dur-slow) var(--ease-out) forwards;
}
.hero .hero-title{animation-delay:50ms}
.hero .hero-subtitle{animation-delay:150ms}
.hero .hero-cta{animation-delay:250ms}
.hero .hero-img{animation-delay:350ms}
@keyframes hero-enter{
  from{opacity:0;transform:translateY(var(--reveal-offset))}
  to{opacity:1;transform:none}
}

/* ─── Accordion / FAQ smooth height (state transitions) ────── */
.faq-answer{transition:opacity var(--dur-base) var(--ease-in-out)}

/* ─── Nav underline sweep (21st.dev-style polish) ──────────── */
nav a{position:relative}
nav a::after{
  content:"";position:absolute;left:0;right:100%;bottom:2px;height:2px;
  background:var(--c4);
  transition:right var(--dur-base) var(--ease-out);
}
nav a:hover::after,nav a.active::after{right:0}

/* ─── Reduced motion: kill everything but opacity ──────────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
  .reveal{opacity:1;transform:none}
  .hero .hero-title,.hero .hero-subtitle,.hero .hero-cta,.hero .hero-img{opacity:1}
}

</style>
</head>
<body>

<div class="hero">
  <div>
    <h1>When Pipes Burst,<br>We Answer.</h1>
    <p class="tagline">Emergency service. Same-day availability. Licensed & insured.</p>
    <a href="tel:+15185551234" class="cta">Call (518) 555-1234</a>
    <span class="phone">24/7 Emergency Service</span>
  </div>
  <div class="scroll-hint">SCROLL</div>
</div>

<div id="world"></div>

<script src="assets/scrub-engine.js"></script>
<script>
/* motionLayerInit */
/* ============================================================
   Motion Layer JS — scroll-reveal + hero, for duda-clone sites
   ============================================================
   - IntersectionObserver-driven .reveal activation
   - Staggered children via --reveal-delay custom property
   - GPU-friendly: only toggles .is-visible (opacity/transform)
   - Respects prefers-reduced-motion (no-op)
   ============================================================ */
(function () {
  'use strict';
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var els = document.querySelectorAll('.reveal');
  if (!els.length || !('IntersectionObserver' in window)) {
    // fallback: show everything
    els.forEach(function (el) { el.classList.add('is-visible'); });
    return;
  }

  // stagger children of a .reveal-parent container
  document.querySelectorAll('.reveal-parent').forEach(function (parent) {
    var kids = parent.querySelectorAll('.reveal');
    kids.forEach(function (kid, i) {
      kid.style.setProperty('--reveal-delay', (i * 70) + 'ms');
    });
  });

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

  els.forEach(function (el) { io.observe(el); });
})();

</script>
</body>
</html>
